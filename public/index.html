<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Users · cf-app-v2</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <main class="mx-auto max-w-2xl px-4 py-12 sm:py-16">
      <header class="mb-8 flex flex-wrap items-start justify-between gap-4">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">Users</h1>
          <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
            One <code class="font-mono text-xs">(Request) =&gt; Response</code> handler, four runtimes.
          </p>
        </div>
        <span
          id="connection"
          role="status"
          data-state="connecting"
          class="inline-flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-600 dark:bg-slate-800 dark:text-slate-300 data-[state=live]:bg-emerald-50 data-[state=live]:text-emerald-700 dark:data-[state=live]:bg-emerald-950 dark:data-[state=live]:text-emerald-300 data-[state=offline]:bg-amber-50 data-[state=offline]:text-amber-700 dark:data-[state=offline]:bg-amber-950 dark:data-[state=offline]:text-amber-300"
        >
          <span class="size-1.5 rounded-full bg-current" aria-hidden="true"></span>
          <span data-field="label">Connecting…</span>
        </span>
      </header>

      <section
        aria-labelledby="create-heading"
        class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900"
      >
        <h2 id="create-heading" class="text-base font-medium">Add a user</h2>
        <form id="create-user" class="mt-4 grid gap-4 sm:grid-cols-[1fr_1fr_auto] sm:items-end">
          <label class="grid gap-1.5 text-sm">
            <span class="font-medium text-slate-700 dark:text-slate-300">Name</span>
            <input
              name="name"
              required
              maxlength="100"
              autocomplete="name"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 shadow-xs outline-none placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100 dark:placeholder:text-slate-600"
              placeholder="Ada Lovelace"
            >
          </label>
          <label class="grid gap-1.5 text-sm">
            <span class="font-medium text-slate-700 dark:text-slate-300">Email</span>
            <input
              name="email"
              type="email"
              required
              maxlength="254"
              autocomplete="email"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 shadow-xs outline-none placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100 dark:placeholder:text-slate-600"
              placeholder="ada@example.com"
            >
          </label>
          <button
            type="submit"
            class="whitespace-nowrap rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:cursor-not-allowed disabled:opacity-60"
          >
            Add user
          </button>
        </form>
        <ul id="form-errors" hidden aria-live="polite"
          class="mt-4 space-y-1 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700 dark:bg-red-950 dark:text-red-300"></ul>
      </section>

      <section aria-labelledby="list-heading" class="mt-10">
        <div class="mb-3 flex items-baseline justify-between">
          <h2 id="list-heading" class="text-base font-medium">All users</h2>
          <span id="user-count" class="text-sm text-slate-500 dark:text-slate-400"></span>
        </div>
        <p
          id="empty-state"
          class="rounded-2xl border border-dashed border-slate-300 px-6 py-10 text-center text-sm text-slate-500 dark:border-slate-700 dark:text-slate-400"
        >
          No users yet. Add the first one above.
        </p>
        <ul
          id="user-list"
          hidden
          class="divide-y divide-slate-200 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:divide-slate-800 dark:border-slate-800 dark:bg-slate-900"
        ></ul>
      </section>
    </main>

    <template id="user-row">
      <li class="flex items-center gap-4 px-5 py-4">
        <span
          data-field="initials"
          aria-hidden="true"
          class="grid size-10 shrink-0 place-items-center rounded-full bg-indigo-50 text-sm font-semibold text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300"
        ></span>
        <div class="min-w-0 flex-1">
          <p data-field="name" class="truncate font-medium"></p>
          <p data-field="email" class="truncate text-sm text-slate-500 dark:text-slate-400"></p>
        </div>
        <time data-field="created" class="shrink-0 text-xs text-slate-400 dark:text-slate-500"></time>
      </li>
    </template>
  </body>
</html>
